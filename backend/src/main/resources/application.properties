spring.application.name=hungergames-supervision
server.port=8080
spring.mvc.problemdetails.enabled=true
# Origines autorisées (front Angular en dev)
app.cors.allowed-origins=http://localhost:4200
# Simulateur de batch : durée d'un "tick" en millisecondes (une élimination par tick)
app.batch.tick-ms=1000
